name: Leadfox CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        # actions/setup-go v7.0.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache: true

      - name: Set up Node.js
        # actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.14.0'

      - name: Run Go tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Run npm tests
        run: npm test

      - name: Build release candidate
        run: make release-candidate VERSION=ci

      - name: Validate release-candidate fixture
        shell: bash
        run: |
          set -euo pipefail
          root="dist/release-candidate/releases/download/vci"
          manifest="$root/release-manifest.json"
          checksums="$root/checksums.txt"
          test -f "$manifest"
          test -f "$checksums"
          test "$(find "$root" -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')" = 4
          test "$(jq -r '.source_commit' "$manifest")" = "0000000000000000000000000000000000000000"
          test "$(jq '.artifacts | length' "$manifest")" = 4
          (cd "$root" && sha256sum -c checksums.txt)
          test -f dist/release-candidate/releases/latest/download/release-manifest.json
